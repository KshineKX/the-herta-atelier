<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大黑塔 · 完整书房动态审阅</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eee8f3;color:#392c47;font:15px/1.65 system-ui,sans-serif}main{max-width:1540px;margin:auto;padding:20px}h1{font-size:25px;margin:0}p{margin:8px 0}.notice{padding:12px 16px;background:#fff8e7;border:1px solid #d5bd81;border-radius:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;margin:16px 0}#stage{position:relative;aspect-ratio:1820/1138;background:#282034 url('/herta-atelier/motion-video?id=home-idle') center/cover;border-radius:14px;overflow:hidden}#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#21182a}video[hidden]{display:none!important}button,select{font:inherit;padding:9px 12px;border:1px solid #b8a0c8;border-radius:10px;background:#fff;color:#5c3f72;cursor:pointer}button:disabled{opacity:.5;cursor:default}.side{display:flex;flex-direction:column;gap:10px}.side label{display:grid;gap:5px}#status{padding:10px;background:#fff9;border-radius:10px;min-height:70px}.clips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.clips article{background:#fff;border-radius:12px;padding:10px}.clips h2{font-size:15px;margin:0 0 8px}.clips video{width:100%;background:#21182a;aspect-ratio:1820/1138}a{color:#705181}.foot{color:#776485;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}#status{grid-column:1/-1}.clips{grid-template-columns:repeat(2,1fr)}}</style>
<main><h1>完整书房动态 · 本地审阅</h1><p class="notice">已确认的起身、离席、返回，以及已通过书本连续性修订的落座与原位待机。新视频尚未安装到 DSH。先点击“完整演示”，应在返回落座后继续原位待机。</p>
<div class="layout"><div id="stage" aria-label="书房视频"></div><aside class="side"><button id="full">完整演示</button><button id="leave">离席</button><button id="return" disabled>回来</button><button id="pause">暂停</button><button id="fullscreen">放大观看</button><label>片段交接<select id="blend"><option value="180">短叠化 · 180ms</option><option value="0">原片直接衔接</option></select></label><div id="status" role="status">正在载入本地视频…</div><p class="foot">短叠化仅减轻切换感，不改变原片。请重点看落座接待机时的手、书本和裙摆轮廓。播放不产生生成费用。</p><a href="/skin-preview.html?motion=dynamic&amp;scene=home">查看皮肤中的效果</a></aside></div>
<h2>五条原片</h2><p>可单独播放；这些是原视频，没有抠像、固定取景重合成或补帧。</p><div class="clips" id="clips"></div><p class="foot">本页只接入本轮书房五条。另两个场景在皮肤候选中保留静态画像，未使用此前未通过的动作片。此页面与浏览器检查不代表 DSH 实机验收。</p></main>
<script type="module">
import{createIdleMotion}from'/packages/skin/src/motion.js';
const $=s=>document.querySelector(s),stage=$('#stage'),options={enabled:true,scene:'home',opacity:1,blendMs:180};let full=false,manualPause=false,disposed=false;
const names={'home-idle':'原位待机','home-rise':'从容起身','home-exit':'离席','home-enter':'返回','home-sit':'落座'};
function refresh(){const s=motion.getState(),busy=s.state==='action'||s.loading;$('#leave').disabled=busy||s.state==='away';$('#return').disabled=busy||s.state!=='away';$('#full').disabled=busy||s.state==='away';$('#blend').disabled=busy;$('#status').textContent=(manualPause?'已暂停 · ':'')+(names[s.clip]||'准备画面')+(s.state==='away'?' · 保持空景，点击回来':s.state==='idle'?' · 循环待机':'');}
const motion=createIdleMotion(document,stage,()=>{$('#status').textContent='本地视频未能播放，请尝试下方单独原片。'},()=>queueMicrotask(refresh));
motion.update({...options});window.hertaReview={motion,options,refresh};
$('#blend').onchange=()=>{options.blendMs=Number($('#blend').value);motion.update({...options})};
$('#leave').onclick=()=>void motion.trigger('leave');$('#return').onclick=()=>void motion.trigger('return');
$('#full').onclick=async()=>{if(full)return;full=true;try{if(await motion.trigger('leave')){await new Promise(r=>setTimeout(r,900));if(!disposed)await motion.trigger('return')}}finally{full=false;refresh()}};
$('#pause').onclick=()=>{manualPause=!manualPause;options.suspended=manualPause;motion.update({...options});$('#pause').textContent=manualPause?'继续':'暂停';refresh()};
$('#fullscreen').onclick=()=>stage.requestFullscreen?.();
for(const[id,label]of Object.entries(names)){const article=document.createElement('article'),h=document.createElement('h2'),v=document.createElement('video'),a=document.createElement('a');h.textContent=label;v.src='/herta-atelier/motion-video?id='+id;v.muted=true;v.playsInline=true;v.controls=true;v.preload='metadata';a.href=v.src;a.textContent='单独打开原片';article.append(h,v,a);$('#clips').append(article)}
const timer=setInterval(refresh,250);window.addEventListener('pagehide',()=>{disposed=true;clearInterval(timer);motion.dispose()},{once:true});
</script></html>
