name: Check
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official tag
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified official tag
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/build.mjs
      - run: node --test tests/*.test.mjs
      - run: node tools/verify.mjs
      - run: node packages/boot/verify/verify-entry.mjs
      - run: node packages/boot/verify/verify-degraded.mjs
      - run: node packages/boot/verify/verify-options.mjs
      - run: node tools/release.mjs
      - run: node tools/release.mjs --core
